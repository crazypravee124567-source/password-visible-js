<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Toggle</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card: #1f2235;
      --border: #2e3148;
      --border-focus: #5c6bc0;
      --accent: #5c6bc0;
      --accent-glow: rgba(92, 107, 192, 0.25);
      --text: #e8eaf6;
      --muted: #6b7280;
      --green: #4caf7d;
      --red: #ef5350;
      --yellow: #ffa726;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      animation: fadeUp 0.4s ease both;
    }

    /* Lock icon */
    .lock-wrap {
      text-align: center;
      margin-bottom: 24px;
    }

    .lock-icon {
      width: 56px;
      height: 56px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      transition: all 0.3s ease;
    }

    .lock-icon.unlocked {
      border-color: var(--green);
      background: rgba(76, 175, 125, 0.1);
    }

    .card h2 {
      text-align: center;
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .card p {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      margin-bottom: 28px;
    }

    /* Input wrapper */
    .input-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .input-wrap input[type="password"],
    .input-wrap input[type="text"] {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.95rem;
      padding: 14px 50px 14px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      letter-spacing: 0.05em;
    }

    .input-wrap input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    /* Eye toggle button */
    .eye-btn {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 1.1rem;
      padding: 4px;
      transition: color 0.2s;
      line-height: 1;
    }

    .eye-btn:hover { color: var(--text); }

    /* Checkbox row */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      cursor: pointer;
      user-select: none;
    }

    .custom-checkbox {
      width: 20px;
      height: 20px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
      font-size: 0.7rem;
    }

    .custom-checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Hide original checkbox */
    #checkbox { display: none; }

    .checkbox-row label {
      font-size: 0.85rem;
      color: var(--muted);
      cursor: pointer;
      transition: color 0.2s;
    }

    .checkbox-row:hover label { color: var(--text); }

    /* Strength meter */
    .strength-section { margin-bottom: 20px; }

    .strength-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      font-family: 'DM Mono', monospace;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .strength-label span { transition: color 0.3s; }

    .strength-bars {
      display: flex;
      gap: 5px;
    }

    .bar {
      flex: 1;
      height: 5px;
      background: var(--border);
      border-radius: 99px;
      transition: background 0.3s;
    }

    /* Status badge */
    .status {
      text-align: center;
      font-size: 0.72rem;
      font-family: 'DM Mono', monospace;
      padding: 8px 12px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: all 0.3s;
    }

    .status.visible {
      background: rgba(76, 175, 125, 0.1);
      border-color: var(--green);
      color: var(--green);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="card">

  <div class="lock-wrap">
    <div class="lock-icon" id="lockIcon">🔒</div>
  </div>

  <h2>Password Toggle</h2>
  <p>// DOM · input type · onchange</p>

  <!-- Password Input -->
  <div class="input-wrap">
    <input type="password" id="inputBox" placeholder="Enter your password" oninput="updateStrength()" />
    <button class="eye-btn" onclick="clickEye()" id="eyeBtn">👁️</button>
  </div>

  <!-- Checkbox row -->
  <div class="checkbox-row" onclick="toggleFromRow()">
    <div class="custom-checkbox" id="customCheck"></div>
    <input type="checkbox" id="checkbox" onchange="togglepassword()" />
    <label for="checkbox">Show Password</label>
  </div>

  <!-- Strength meter -->
  <div class="strength-section">
    <div class="strength-label">
      <span>Password Strength</span>
      <span id="strength-text">—</span>
    </div>
    <div class="strength-bars">
      <div class="bar" id="bar1"></div>
      <div class="bar" id="bar2"></div>
      <div class="bar" id="bar3"></div>
      <div class="bar" id="bar4"></div>
    </div>
  </div>

  <!-- Status -->
  <div class="status" id="statusBadge">🔐 password is hidden</div>

</div>

<script>
  // ── Your original JS logic ───────────────────────────────────────────

  function togglepassword() {
    let checkbox = document.getElementById("checkbox").checked;
    let password = document.getElementById("inputBox");
    if (checkbox) {
      password.type = "text";
    } else {
      password.type = "password";
    }
    updateVisualState(checkbox);
  }

  // ── UI Helpers ───────────────────────────────────────────────────────

  function updateVisualState(isVisible) {
    const lock   = document.getElementById("lockIcon");
    const status = document.getElementById("statusBadge");
    const check  = document.getElementById("customCheck");
    const eye    = document.getElementById("eyeBtn");

    if (isVisible) {
      lock.textContent   = "🔓";
      lock.classList.add("unlocked");
      status.textContent = "👁️ password is visible";
      status.classList.add("visible");
      check.textContent  = "✓";
      check.classList.add("checked");
      eye.textContent    = "🙈";
    } else {
      lock.textContent   = "🔒";
      lock.classList.remove("unlocked");
      status.textContent = "🔐 password is hidden";
      status.classList.remove("visible");
      check.textContent  = "";
      check.classList.remove("checked");
      eye.textContent    = "👁️";
    }
  }

  // Click on the eye button
  function clickEye() {
    const cb = document.getElementById("checkbox");
    cb.checked = !cb.checked;
    togglepassword();
  }

  // Click anywhere on the row
  function toggleFromRow() {
    const cb = document.getElementById("checkbox");
    cb.checked = !cb.checked;
    togglepassword();
  }

  // Password strength meter
  function updateStrength() {
    const val = document.getElementById("inputBox").value;
    const bars = [
      document.getElementById("bar1"),
      document.getElementById("bar2"),
      document.getElementById("bar3"),
      document.getElementById("bar4"),
    ];
    const label = document.getElementById("strength-text");

    bars.forEach(b => b.style.background = "");

    let score = 0;
    if (val.length >= 6)                        score++;
    if (val.length >= 10)                       score++;
    if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
    if (/[^A-Za-z0-9]/.test(val))              score++;

    const colors = ["#ef5350", "#ffa726", "#5c6bc0", "#4caf7d"];
    const labels = ["Weak", "Fair", "Good", "Strong"];

    if (val.length === 0) { label.textContent = "—"; return; }

    for (let i = 0; i < score; i++) {
      bars[i].style.background = colors[score - 1];
    }
    label.style.color  = colors[score - 1];
    label.textContent  = labels[score - 1];
  }
</script>

</body>
</html>
